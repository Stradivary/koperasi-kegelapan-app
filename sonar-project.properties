sonar.projectKey=Stradivary_koperasi-kegelapan-app
sonar.organization=stradivary
sonar.projectName=koperasi-kegelapan

# Sources & tests
sonar.sources=src,api/src
sonar.exclusions=\
  src/routeTree.gen.ts,\
  src/db/**,\
  src/components/ui/**,\
  src/lib/indexeddb.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/__tests__/**,\
  **/scripts/**,\
  src/test-setup.ts,\
  src/integrations/**,\
  src/assets/**

# Coverage - must match vitest.config.ts coverage.exclude
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  src/routes/**,\
  src/main.tsx,\
  src/routeTree.gen.ts,\
  src/components/ui/**,\
  src/test-setup.ts,\
  **/scripts/**,\
  src/db/**,\
  src/lib/indexeddb.ts,\
  **/__tests__/**,\
  **/__mocks__/**,\
  src/integrations/**

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

sonar.sourceEncoding=UTF-8
