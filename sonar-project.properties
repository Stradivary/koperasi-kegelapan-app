sonar.projectKey=Stradivary_koperasi-kegelapan-app
sonar.organization=stradivary
sonar.projectName=koperasi-kegelapan

# Sources & tests
sonar.sources=src,api/src
sonar.exclusions=\
  src/routeTree.gen.ts,\
  src/db/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/__tests__/**,\
  src/integrations/**

# Coverage — must match vitest.config.ts coverage.exclude
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\  
  src/routes/**,\
  src/main.tsx,\
  src/routeTree.gen.ts,\
  src/db/index.ts,\
  **/__tests__/**,\
  src/integrations/**

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

sonar.sourceEncoding=UTF-8
