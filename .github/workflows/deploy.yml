name: Deploy — Cloudflare Pages

on:
  push:
    branches: [master, develop]

  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Job 1: CI Gate (lint + typecheck + test) ────────────────────────────
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci-test.yml

  # ─── Job 2: Build & Deploy (Staging — develop branch) ───────────────────
  deploy-staging:
    name: Deploy to Staging (dev.ahmadmuzaki.my.id)
    runs-on: ubuntu-latest
    needs: ci
    if: >-
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')

    environment:
      name: staging
      url: https://dev.ahmadmuzaki.my.id

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (staging)
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL_STAGING }}
          VITE_APP_ENV: staging

      - name: Deploy to Cloudflare Pages (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=koperasi-kegelapan-app --branch=develop

      - name: Summary
        run: echo "✅ Deployed to **staging** (dev.ahmadmuzaki.my.id) — ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  # ─── Job 3: Build & Deploy (Production — master branch) ─────────────────
  deploy-production:
    name: Deploy to Production (ahmadmuzaki.my.id)
    runs-on: ubuntu-latest
    needs: ci
    if: >-
      (github.ref == 'refs/heads/master' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')

    environment:
      name: production
      url: https://ahmadmuzaki.my.id

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (production)
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL_PRODUCTION }}
          VITE_APP_ENV: production

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=koperasi-kegelapan-app --branch=master

      - name: Summary
        run: echo "✅ Deployed to **production** (ahmadmuzaki.my.id) — ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  # ─── Job 4: Deploy API Worker ────────────────────────────────────────────
  deploy-api:
    name: Deploy API Worker
    runs-on: ubuntu-latest
    needs: ci
    if: >-
      (github.ref == 'refs/heads/master' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')

    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.api.jsonc
