name: Pipeline

on:
  push:
    branches: [develop]
    tags: ["v*"]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * 1" # Weekly Monday 03:00 UTC — keeps OWASP NVD cache fresh
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (manual deploy)
        required: true
        default: production
        type: choice
        options: [production, staging]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-flight deploy

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — CI Gate (lint · typecheck · unit tests · arch boundaries)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  # ── 1a. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: "CI Gate · Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache node_modules as an artifact so downstream jobs skip re-install
      - name: Upload node_modules cache
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            api/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Oxlint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  # ── 1b. Typecheck ───────────────────────────────────────────────────────────
  typecheck:
    name: "CI Gate · Typecheck"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            api/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Install dependencies (fallback if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  # ── 1c. Unit Tests ──────────────────────────────────────────────────────────
  unit-test:
    name: "CI Gate · Unit Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            api/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Install dependencies (fallback if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 7

  # ── 1d. Architecture Boundaries ─────────────────────────────────────────────
  boundary-check:
    name: "CI Gate · Architecture Boundaries"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            api/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Install dependencies (fallback if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Check architecture boundaries
        run: pnpm tsx scripts/check-boundaries.ts

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 2 — Static Analysis (OWASP + SonarCloud)
  # Runs only after the full CI Gate passes.
  # ─────────────────────────────────────────────────────────────────────────────

  # ── 2a. npm audit (OWASP fast scan) ─────────────────────────────────────────
  npm-audit:
    name: "Static Analysis · npm Audit (OWASP)"
    runs-on: ubuntu-latest
    needs: [typecheck, unit-test, boundary-check]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            api/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Install dependencies (fallback if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (fail on high+)
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Audit report (JSON)
        run: pnpm audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report-${{ github.run_id }}
          path: audit-report.json
          retention-days: 30

  # ── 2b. OWASP Dependency-Check (full NVD scan) ──────────────────────────────
  owasp-dependency-check:
    name: "Static Analysis · OWASP Dependency-Check"
    runs-on: ubuntu-latest
    needs: [typecheck, unit-test, boundary-check]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            api/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Install dependencies (fallback if cache miss)
        run: pnpm install --frozen-lockfile

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: koperasi-kegelapan
          path: .
          format: HTML
          out: owasp-report
          args: >
            --enableRetired
            --nodePackageSkipDevDependencies

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report-${{ github.run_id }}
          path: owasp-report/
          retention-days: 30

  # ── 2c. SonarCloud — with enforced Quality Gate ──────────────────────────────
  sonarcloud:
    name: "Static Analysis · SonarCloud (Quality Gate enforced)"
    runs-on: ubuntu-latest
    needs: [typecheck, unit-test, boundary-check]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for blame annotations

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            api/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Install dependencies (fallback if cache miss)
        run: pnpm install --frozen-lockfile

      # Prefer coverage produced by the unit-test job in this same run
      - name: Download coverage artifact
        id: download-coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
        continue-on-error: true

      - name: Run tests with coverage (fallback if artifact missing)
        if: steps.download-coverage.outcome == 'failure'
        run: pnpm test:coverage

      # sonar.qualitygate.wait=true makes the scanner block until the gate
      # result is available and exits non-zero when the gate is RED.
      - name: SonarCloud Scan (Quality Gate enforced)
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=1300

      - name: Quality Gate summary
        if: always()
        run: |
          echo "### SonarCloud Quality Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Project: \`Stradivary_koperasi-kegelapan-app\`" >> "$GITHUB_STEP_SUMMARY"
          echo "See full report: https://sonarcloud.io/project/overview?id=Stradivary_koperasi-kegelapan-app" >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────────────────────────────
  # STAGE 3 — Deploy (Staging or Production)
  # Runs only after ALL static-analysis jobs pass (including Sonar gate).
  # ─────────────────────────────────────────────────────────────────────────────

  # ── Shared build step — produces dist/ artifact reused by all deploy jobs ───
  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: [npm-audit, owasp-dependency-check, sonarcloud]
    # Only build when a deploy is actually going to happen
    if: >-
      (github.ref == 'refs/heads/develop' && github.event_name == 'push') ||
      (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      environment: ${{ steps.env-detect.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            api/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Install dependencies (fallback if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Detect target environment
        id: env-detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build (staging)
        if: steps.env-detect.outputs.environment == 'staging'
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL_STAGING }}
          VITE_APP_ENV: staging

      - name: Build (production)
        if: steps.env-detect.outputs.environment == 'production'
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL_PRODUCTION }}
          VITE_APP_ENV: production

      # Upload dist so deploy jobs don't rebuild from scratch
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          retention-days: 1

  # ── 3a. Deploy Frontend — Staging ───────────────────────────────────────────
  deploy-staging:
    name: "Deploy · Frontend → Staging"
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.environment == 'staging'
    environment:
      name: staging
      url: https://develop.koperasi-kegelapan-app.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/

      - name: Deploy to Cloudflare Pages (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          packageManager: pnpm
          command: pages deploy dist --project-name=koperasi-kegelapan-app --branch=develop

      - name: Summary
        run: echo "✅ Frontend deployed to **staging** (develop.koperasi-kegelapan-app.pages.dev) — ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  # ── 3b. Deploy API Worker — Staging ─────────────────────────────────────────
  deploy-api-staging:
    name: "Deploy · API Worker → Staging"
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.environment == 'staging'
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            api/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Install dependencies (fallback if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Deploy API Worker (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy --config wrangler.api.staging.jsonc

      - name: Summary
        run: echo "✅ API Worker deployed to **staging** — ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  # ── 3c. Deploy Frontend — Production ────────────────────────────────────────
  deploy-production:
    name: "Deploy · Frontend → Production"
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.environment == 'production'
    environment:
      name: production
      url: https://ahmadmuzaki.my.id
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.run_id }}
          path: dist/

      - name: Deploy to Cloudflare Pages (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          packageManager: pnpm
          command: pages deploy dist --project-name=koperasi-kegelapan-app --branch=master

      - name: Summary
        run: echo "✅ Frontend deployed to **production** (ahmadmuzaki.my.id) — ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  # ── 3d. Deploy API Worker — Production ──────────────────────────────────────
  deploy-api-production:
    name: "Deploy · API Worker → Production"
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.environment == 'production'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore node_modules cache
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            api/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Install dependencies (fallback if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Deploy API Worker (production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy --config wrangler.api.jsonc

      - name: Summary
        run: echo "✅ API Worker deployed to **production** — ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
